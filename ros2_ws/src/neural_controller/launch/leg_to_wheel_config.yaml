controller_manager:
  ros__parameters:
    neural_controller_leg_to_wheel:
      type: neural_controller/LegToWheelController

neural_controller_leg_to_wheel:
  ros__parameters:
    calibration_required: true
    repeat_action: 10
    observation_history: 4
    gain_multiplier: 1.0
    estop_kd: 0.0
    init_duration: 0.0
    fade_in_duration: 0.0
    max_body_angle: 0.6
    use_imu: true
    imu_sensor_name: "imu_sensor"
    model_path: "$(find-pkg-share neural_controller)/launch/policy_leg_to_wheel.json"
    joint_names: ["leg_front_r_1", "leg_front_r_2", "leg_front_r_3", "leg_front_l_1", "leg_front_l_2", "leg_front_l_3", "leg_back_r_1", "leg_back_r_2", "leg_back_r_3", "leg_back_l_1", "leg_back_l_2", "leg_back_l_3"]
    action_types: ["position", "position", "position", "position", "position", "position", "position", "position", "position", "position", "position", "position"]
    default_joint_pos: [1.0, 0.0, -1.0, -1.0, 0.0, 1.0, 1.0, 0.0, -1.0, -1.0, 0.0, 1.0]
    kps: [5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0]
    kds: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]
    joint_lower_limits: [-1.22, -0.42, -2.79, -2.51, -3.14, -0.71, -1.22, -0.42, -2.79, -2.51, -3.14, -0.71]
    joint_upper_limits: [2.51, 3.14, 0.71, 1.22, 0.42, 2.79, 2.51, 3.14, 0.71, 1.22, 0.42, 2.79]
    action_scales: [0.5, 1.0, 0.8, 0.5, 1.0, 0.8, 0.5, 1.0, 0.8, 0.5, 1.0, 0.8]
    init_kps: [5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0]
    init_kds: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]

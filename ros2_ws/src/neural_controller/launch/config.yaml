# joy_node:
#   ros__parameters:
#     dev: "/dev/input/js0"
#     autorepeat_rate: 50.0
#     coalesce_interval_ms: 20

joy_linux_node:
  ros__parameters:
    dev: "/dev/input/js0"
    autorepeat_rate: 50.0
    coalesce_interval: 0.02

joint_state_broadcaster:
  ros__parameters:
    update_rate: 260
    use_local_topics: false

cmd_vel_mux:
  ros__parameters:
    deadband: 0.05
    joystick_timeout_ms: 500

joy_util_node:
  ros__parameters:
    estop_index: 12
    estop_release_index: 9
    # NOTE: switch_button_indices maps POSITIONALLY onto the first entries of
    # controller_names (estop_controller.cpp: switch_button_indices_[i] ->
    # controller_names_[i]), so the order of the first three entries here is
    # load-bearing. The remaining entries are not button-mapped; they are listed so
    # this node deactivates them when switching.
    controller_names: ["neural_controller", "neural_controller_three_legged", "neural_controller_wheel", "neural_controller_leg_lift", "forward_kp_controller", "forward_kd_controller", "forward_position_controller"]
    # X (0) -> neural_controller (locomotion, also exits leg-lift/wheel mode).
    # Square (3) -> neural_controller_three_legged.
    # Triangle (2) -> neural_controller_wheel (the wheeled velocity policy; drive it
    #   with /cmd_vel from the sticks, same as locomotion).
    # O (1) is NOT here: it's the leg-lift button below, handled separately since it
    # enters leg-lift mode on first press and cycles legs on repeated presses, rather
    # than switching once.
    switch_button_indices: [0, 3, 2]

    # O-button leg-lift cycle. First press (from any other controller) activates
    # neural_controller_leg_lift and immediately commands front_l; each subsequent press while
    # it's active advances to the next state in leg_lift_cycle_states. Press X to leave leg-lift
    # mode and return to locomotion.
    leg_lift_button_index: 1
    leg_lift_controller_name: "neural_controller_leg_lift"
    # Must match configs.COMMAND_STATES / policy_leg_lift.json's command_states (index 0 = stand)
    # so button presses map to the command indices the policy was trained on.
    leg_lift_command_states: ["stand", "front_l", "front_r", "back_r", "back_l"]
    # The order O steps through: front_l -> front_r -> back_r -> back_l -> repeat. "stand" is
    # reachable via the X button (switches back to locomotion), not part of this repeating cycle.
    leg_lift_cycle_states: ["front_l", "front_r", "back_r", "back_l"]


    # Should develop a better way to handle this in the future
    update_rate: 520

    neural_controller:
      type: neural_controller/NeuralController

    neural_controller_three_legged:
      type: neural_controller/NeuralController

    neural_controller_leg_lift:
      type: neural_controller/NeuralController

    neural_controller_wheel_align_hybrid:
      type: neural_controller/NeuralController

    neural_controller_keyframe_align:
      type: neural_controller/KeyframeController

    neural_controller_wheel:
      type: neural_controller/NeuralController

    # New leg-walking policy trained on the `leg` branch (mujoco_playground/workspace),
    # SIM-VALIDATED ONLY -- not yet run on hardware. Added as its own instance so it
    # can be bench/hardware-tested without touching the currently deployed
    # `neural_controller` (locomotion) or any other instance below. See

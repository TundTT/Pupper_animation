controller_manager:
  ros__parameters:
    # Run slightly above nominal 500Hz in order to get exactly 50hz for neural controller
    # Should develop a better way to handle this in the future
    update_rate: 520

    neural_controller:
      type: neural_controller/NeuralController

    neural_controller_three_legged:
      type: neural_controller/NeuralController

    neural_controller_leg_lift:
      type: neural_controller/NeuralController

    neural_controller_wheel:
      type: neural_controller/NeuralController

    # New leg-walking policy trained on the `leg` branch (mujoco_playground/workspace),
    # SIM-VALIDATED ONLY -- not yet run on hardware. Added as its own instance so it
    # can be bench/hardware-tested without touching the currently deployed
    # `neural_controller` (locomotion) or any other instance below. See
    # policy_walk_v2_TESTING.md.
    neural_controller_walk_v2:
      type: neural_controller/NeuralController

    # Forward command controllers for animation
    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    forward_kp_controller:
      type: forward_command_controller/ForwardCommandController

    forward_kd_controller:
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

